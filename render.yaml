services:
  - type: web
    name: saki-browser-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://saki-browser.vercel.app,http://localhost:3000
      - key: APP_URL
        value: https://saki-browser.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
