<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saki Browser - AI Notebook Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2128;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-secondary: #1f6feb;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --code-bg: #161b22;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-indicator.offline {
            background: var(--danger);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: var(--bg-hover);
        }

        .session-item.active {
            background: var(--accent-secondary);
        }

        .session-title {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .session-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .new-session-btn {
            margin: 12px;
            padding: 10px;
            background: var(--accent-secondary);
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-session-btn:hover {
            background: var(--accent-primary);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .message-role {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .message.user .message-role {
            color: var(--accent-primary);
        }

        .message.assistant .message-role {
            color: var(--success);
        }

        .message-content {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 8px;
            line-height: 1.6;
        }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .message-content h1:first-child,
        .message-content h2:first-child,
        .message-content h3:first-child {
            margin-top: 0;
        }

        .message-content ul,
        .message-content ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .message-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
        }

        .code-block {
            position: relative;
            margin: 12px 0;
        }

        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px 6px 0 0;
            border-bottom: 1px solid var(--border-color);
        }

        .code-block-lang {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .code-block-actions {
            display: flex;
            gap: 8px;
        }

        .code-block-btn {
            padding: 4px 8px;
            font-size: 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .code-block-btn:hover {
            background: var(--accent-secondary);
        }

        .code-block pre {
            margin: 0;
            padding: 16px;
            background: var(--code-bg);
            border-radius: 0 0 6px 6px;
            overflow-x: auto;
        }

        .code-block code {
            background: none;
            padding: 0;
        }

        .input-container {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 150px;
            font-family: inherit;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .send-btn {
            padding: 12px 24px;
            background: var(--accent-secondary);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-primary);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .right-panel {
            width: 300px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 20px;
        }

        .panel-section {
            margin-bottom: 24px;
        }

        .panel-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .model-select {
            width: 100%;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }

        .model-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .persona-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .persona-btn {
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-align: left;
        }

        .persona-btn:hover {
            background: var(--bg-hover);
        }

        .persona-btn.active {
            background: var(--accent-secondary);
            border-color: var(--accent-primary);
        }

        .model-info {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
        }

        .model-info-item {
            margin-bottom: 8px;
        }

        .model-info-item:last-child {
            margin-bottom: 0;
        }

        .model-info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .streaming-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            padding: 40px;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>
                <span class="status-indicator" id="statusIndicator"></span>
                Saki Browser
            </h1>
            <div style="font-size: 12px; color: var(--text-secondary);">
                AI Notebook Assistant
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Sessions</h2>
                </div>
                <div class="sessions-list" id="sessionsList">
                    <div class="session-item active" data-session-id="default">
                        <div class="session-title">New Chat</div>
                        <div class="session-time">Just now</div>
                    </div>
                </div>
                <button class="new-session-btn" id="newSessionBtn">+ New Session</button>
            </aside>

            <main class="chat-container">
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <h2>Welcome to Saki Browser</h2>
                        <p>Your intelligent notebook assistant powered by multiple AI models. Start a conversation to begin.</p>
                    </div>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            class="input-field" 
                            id="messageInput" 
                            placeholder="Ask anything... (Shift+Enter for new line)"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn">Send</button>
                    </div>
                </div>
            </main>

            <aside class="right-panel">
                <div class="panel-section">
                    <h3>Model</h3>
                    <select class="model-select" id="modelSelect">
                        <option value="anthropic/claude-3.5-sonnet">Claude Sonnet 3.5 (Default)</option>
                        <option value="openai/gpt-oss-20b:free">GPT OSS 20B</option>
                        <option value="qwen/qwen3-coder:free">Qwen3 Coder</option>
                        <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air</option>
                        <option value="google/gemma-3n-e2b-it:free">Gemma 3N E2B IT</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h3>Persona</h3>
                    <div class="persona-buttons">
                        <button class="persona-btn" data-persona="concise">
                            <strong>Concise</strong>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                Brief, direct answers
                            </div>
                        </button>
                        <button class="persona-btn active" data-persona="helpful">
                            <strong>Helpful</strong>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                Clear, detailed responses
                            </div>
                        </button>
                        <button class="persona-btn" data-persona="creative">
                            <strong>Creative</strong>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                Imaginative, engaging
                            </div>
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Model Info</h3>
                    <div class="model-info" id="modelInfo">
                        <div class="model-info-item">
                            <span class="model-info-label">Provider:</span> Anthropic
                        </div>
                        <div class="model-info-item">
                            <span class="model-info-label">Model:</span> Claude Sonnet 3.5
                        </div>
                        <div class="model-info-item">
                            <span class="model-info-label">Streaming:</span> Enabled
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        let currentSession = {
            id: 'default',
            messages: [],
            title: 'New Chat'
        };
        let sessions = [currentSession];
        let selectedModel = 'anthropic/claude-3.5-sonnet';
        let selectedPersona = 'helpful';
        let isStreaming = false;

        const statusIndicator = document.getElementById('statusIndicator');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const sessionsList = document.getElementById('sessionsList');
        const newSessionBtn = document.getElementById('newSessionBtn');

        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                if (response.ok) {
                    statusIndicator.classList.remove('offline');
                } else {
                    statusIndicator.classList.add('offline');
                }
            } catch (error) {
                statusIndicator.classList.add('offline');
            }
        }

        checkApiStatus();
        setInterval(checkApiStatus, 30000);

        document.querySelectorAll('.persona-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPersona = btn.dataset.persona;
            });
        });

        modelSelect.addEventListener('change', (e) => {
            selectedModel = e.target.value;
            updateModelInfo();
        });

        function updateModelInfo() {
            const modelInfo = document.getElementById('modelInfo');
            const models = {
                'anthropic/claude-3.5-sonnet': { provider: 'Anthropic', name: 'Claude Sonnet 3.5' },
                'openai/gpt-oss-20b:free': { provider: 'OpenAI', name: 'GPT OSS 20B' },
                'qwen/qwen3-coder:free': { provider: 'Qwen', name: 'Qwen3 Coder' },
                'z-ai/glm-4.5-air:free': { provider: 'Z-AI', name: 'GLM 4.5 Air' },
                'google/gemma-3n-e2b-it:free': { provider: 'Google', name: 'Gemma 3N E2B IT' }
            };
            const model = models[selectedModel] || { provider: 'Unknown', name: 'Unknown' };
            modelInfo.innerHTML = `
                <div class="model-info-item">
                    <span class="model-info-label">Provider:</span> ${model.provider}
                </div>
                <div class="model-info-item">
                    <span class="model-info-label">Model:</span> ${model.name}
                </div>
                <div class="model-info-item">
                    <span class="model-info-label">Streaming:</span> Enabled
                </div>
            `;
        }

        function renderMessage(message, isStreaming = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${message.role}`;
            
            const header = document.createElement('div');
            header.className = 'message-header';
            header.innerHTML = `
                <span class="message-role">${message.role === 'user' ? 'You' : 'Assistant'}</span>
                ${isStreaming ? '<span class="streaming-indicator"></span>' : ''}
            `;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = parseMarkdown(message.content);
            
            messageEl.appendChild(header);
            messageEl.appendChild(content);
            
            return messageEl;
        }

        function parseMarkdown(text) {
            let html = text;
            
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang || 'text';
                const codeContent = code.trim();
                return `
                    <div class="code-block">
                        <div class="code-block-header">
                            <span class="code-block-lang">${language}</span>
                            <div class="code-block-actions">
                                <button class="code-block-btn" onclick="copyCode(this)">Copy</button>
                                <button class="code-block-btn" onclick="downloadCode(this, '${language}')">Download</button>
                            </div>
                        </div>
                        <pre><code>${escapeHtml(codeContent)}</code></pre>
                    </div>
                `;
            });
            
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
            
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.copyCode = function(btn) {
            const codeBlock = btn.closest('.code-block');
            const code = codeBlock.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                }, 2000);
            });
        };

        window.downloadCode = function(btn, lang) {
            const codeBlock = btn.closest('.code-block');
            const code = codeBlock.querySelector('code').textContent;
            const extensions = {
                javascript: 'js',
                python: 'py',
                html: 'html',
                css: 'css',
                typescript: 'ts',
                text: 'txt'
            };
            const ext = extensions[lang] || 'txt';
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        };

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isStreaming) return;

            const userMessage = { role: 'user', content };
            currentSession.messages.push(userMessage);

            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            messagesContainer.appendChild(renderMessage(userMessage));
            messageInput.value = '';
            messageInput.style.height = 'auto';

            const assistantMessage = { role: 'assistant', content: '' };
            currentSession.messages.push(assistantMessage);
            const assistantMessageEl = renderMessage(assistantMessage, true);
            messagesContainer.appendChild(assistantMessageEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            isStreaming = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: currentSession.messages.slice(0, -1),
                        model: selectedModel,
                        stream: true,
                        persona: selectedPersona
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            try {
                                const json = JSON.parse(data);
                                if (json.text) {
                                    assistantMessage.content += json.text;
                                    const contentEl = assistantMessageEl.querySelector('.message-content');
                                    contentEl.innerHTML = parseMarkdown(assistantMessage.content);
                                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                                }
                                if (json.done || json.error) {
                                    break;
                                }
                            } catch (e) {
                                console.error('Failed to parse SSE data:', e);
                            }
                        }
                    }
                }

                const streamingIndicator = assistantMessageEl.querySelector('.streaming-indicator');
                if (streamingIndicator) {
                    streamingIndicator.remove();
                }

                if (currentSession.messages.length === 2 && currentSession.title === 'New Chat') {
                    currentSession.title = content.slice(0, 50) + (content.length > 50 ? '...' : '');
                    updateSessionsList();
                }

            } catch (error) {
                console.error('Error sending message:', error);
                assistantMessage.content = `Error: ${error.message}`;
                const contentEl = assistantMessageEl.querySelector('.message-content');
                contentEl.innerHTML = parseMarkdown(assistantMessage.content);
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
            }
        }

        function updateSessionsList() {
            sessionsList.innerHTML = sessions.map(session => `
                <div class="session-item ${session.id === currentSession.id ? 'active' : ''}" data-session-id="${session.id}">
                    <div class="session-title">${session.title}</div>
                    <div class="session-time">${session.messages.length} messages</div>
                </div>
            `).join('');

            sessionsList.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.dataset.sessionId;
                    switchSession(sessionId);
                });
            });
        }

        function switchSession(sessionId) {
            currentSession = sessions.find(s => s.id === sessionId);
            updateSessionsList();
            renderCurrentSession();
        }

        function renderCurrentSession() {
            messagesContainer.innerHTML = '';
            if (currentSession.messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Welcome to Saki Browser</h2>
                        <p>Your intelligent notebook assistant powered by multiple AI models. Start a conversation to begin.</p>
                    </div>
                `;
            } else {
                currentSession.messages.forEach(msg => {
                    messagesContainer.appendChild(renderMessage(msg));
                });
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        newSessionBtn.addEventListener('click', () => {
            const newSession = {
                id: `session-${Date.now()}`,
                messages: [],
                title: 'New Chat'
            };
            sessions.push(newSession);
            currentSession = newSession;
            updateSessionsList();
            renderCurrentSession();
        });

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
