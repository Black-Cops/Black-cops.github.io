<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Short URL Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #f8fafc;
      color: #222;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 400px;
      margin: 60px auto 0 auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      padding: 2.5rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      text-align: center;
      letter-spacing: -1px;
    }
    label {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    input[type="url"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
      background: #f9fafb;
    }
    input[type="url"]:focus {
      border: 1.5px solid #60a5fa;
      background: #fff;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    button:active {
      background: #1d4ed8;
    }
    .output {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      word-break: break-all;
      margin-top: 0.5rem;
    }
    .output a {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }
    .copy-btn {
      background: #e0e7ef;
      color: #2563eb;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:active {
      background: #c7d2fe;
    }
    .footer {
      margin-top: auto;
      padding: 1.2rem 0 1.1rem 0;
      background: #f1f5f9;
      text-align: center;
      font-size: 1rem;
      color: #555;
      border-top: 1px solid #e5e7eb;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 0.5rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .footer a:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }
    @media (max-width: 500px) {
      .container {
        max-width: 98vw;
        padding: 1.2rem 0.7rem 1.2rem 0.7rem;
      }
      h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Short URL Generator</h1>
    <form id="shorten-form" autocomplete="off">
      <label for="long-url">Paste your long URL:</label>
      <input type="url" id="long-url" name="long-url" placeholder="https://example.com/very/long/url" required>
      <button type="submit">Shorten URL</button>
    </form>
    <div id="result" style="display:none;"></div>
  </div>
  <div class="footer">
    Developed by Saqib Sarwar &nbsp;|&nbsp;
    <a href="https://www.linkedin.com/in/saqibsarwar1280/" target="_blank" rel="noopener">LinkedIn</a>
    &nbsp;|&nbsp;
    <a href="https://www.instagram.com/technosaqib_/" target="_blank" rel="noopener">Instagram</a>
  </div>
  <script>
    const form = document.getElementById('shorten-form');
    const resultDiv = document.getElementById('result');
    let shortUrl = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const longUrl = document.getElementById('long-url').value.trim();
      if (!longUrl) return;
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';
      form.querySelector('button').disabled = true;
      form.querySelector('button').textContent = 'Shortening...';
      try {
        // Ulvis API call
        const res = await fetch(`https://ulvis.net/API/write/getshort?url=${encodeURIComponent(longUrl)}`);
        const data = await res.json();
        if (data && data.result_url) {
          shortUrl = data.result_url;
          showResult(shortUrl);
        } else {
          showError('Failed to shorten URL.');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      }
      form.querySelector('button').disabled = false;
      form.querySelector('button').textContent = 'Shorten URL';
    });

    function showResult(url) {
      resultDiv.innerHTML = `
        <div class="output">
          <a href="${url}" target="_blank" id="short-url-link">${url}</a>
          <button class="copy-btn" id="copy-btn">Copy</button>
        </div>
      `;
      resultDiv.style.display = 'block';
      const link = document.getElementById('short-url-link');
      const copyBtn = document.getElementById('copy-btn');
      link.onclick = (e) => {
        e.preventDefault();
        copyToClipboard(url);
      };
      copyBtn.onclick = () => copyToClipboard(url);
    }

    function showError(msg) {
      resultDiv.innerHTML = `<div style="color:#dc2626; font-weight:500; padding:0.7rem 0;">${msg}</div>`;
      resultDiv.style.display = 'block';
    }

    function copyToClipboard(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showCopied();
        });
      } else {
        // fallback
        const temp = document.createElement('input');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showCopied();
      }
    }

    function showCopied() {
      const copyBtn = document.getElementById('copy-btn');
      if (copyBtn) {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
        }, 1200);
      }
    }
  </script>
</body>
</html>
